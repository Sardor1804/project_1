<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijoz sharhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1b1e;
    --panel:#16262a;
    --panel-2:#1c2f33;
    --paper:#f4ede0;
    --paper-dim:#c9c0ac;
    --gold:#e8a33d;
    --gold-dim:#c98a2e;
    --plus:#7fb87a;
    --minus:#d97b6c;
    --line: rgba(244,237,224,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2d31 0%, transparent 60%),
      radial-gradient(1000px 700px at 100% 110%, #17282b 0%, transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px 100px;
  }

  .wrap{ width:100%; max-width:620px; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before{
    content:"";
    width:22px;height:1px;background:var(--gold-dim);display:inline-block;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(32px, 5vw, 44px);
    line-height:1.08;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 em{ color:var(--gold); font-style:normal; }

  .lede{
    color:var(--paper-dim);
    font-size:15px;
    line-height:1.6;
    max-width:46ch;
    margin:0 0 40px;
  }

  /* ---- receipt card ---- */
  .receipt{
    position:relative;
    background:var(--panel);
    border-radius:2px;
    padding:44px 40px 40px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.6), 0 0 0 1px rgba(244,237,224,0.05);
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:16px;
    background:
      radial-gradient(circle at 12px 50%, transparent 8px, var(--ink) 8.5px) repeat-x;
    background-size: 24px 16px;
  }
  .receipt::before{ top:-8px; }
  .receipt::after{ bottom:-8px; transform:scaleY(-1); }

  .stub-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:0.04em;
    padding-bottom:20px;
    margin-bottom:28px;
    border-bottom:1px dashed var(--line);
  }

  fieldset{ border:none; margin:0; padding:0; }

  .field-label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--paper);
    margin-bottom:8px;
  }
  .field-sub{
    display:block;
    font-size:12px;
    color:var(--paper-dim);
    font-weight:400;
    margin-top:2px;
  }

  .section{ margin-bottom:30px; }

  /* --- star rating --- */
  .rating-block{
    text-align:center;
    padding:8px 0 26px;
    margin-bottom:30px;
    border-bottom:1px dashed var(--line);
  }
  .rating-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin-bottom:16px;
  }
  .stars{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:12px;
  }
  .star{
    width:40px; height:40px;
    cursor:pointer;
    color: rgba(244,237,224,0.18);
    transition: transform .15s ease, color .15s ease;
  }
  .star:hover{ transform: translateY(-3px) scale(1.08); }
  .star svg{ width:100%; height:100%; display:block; }
  .star.active{ color: var(--gold); filter: drop-shadow(0 4px 10px rgba(232,163,61,0.35)); }

  .rating-caption{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:16px;
    color:var(--gold);
    height:22px;
  }

  /* --- inputs --- */
  input[type=text], input[type=email], textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:12px 14px;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
    resize:vertical;
  }
  input::placeholder, textarea::placeholder{ color:#5c6f72; }
  input:focus, textarea:focus{
    border-color:var(--gold-dim);
    background:#20363a;
  }
  input:focus-visible, textarea:focus-visible, .star:focus-visible, .toggle:focus-visible, button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  /* --- pros/cons ledger --- */
  .ledger{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    gap:20px;
    margin-bottom:8px;
  }
  .ledger-divider{ background:var(--line); }
  .ledger-col .field-label{
    display:flex; align-items:center; gap:8px;
  }
  .tag{
    width:18px;height:18px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; flex:none;
    font-family:'JetBrains Mono', monospace;
  }
  .tag.plus{ background:rgba(127,184,122,0.15); color:var(--plus); }
  .tag.minus{ background:rgba(217,123,108,0.15); color:var(--minus); }
  .ledger textarea{ min-height:96px; }
  .ledger-col.plus textarea:focus{ border-color:var(--plus); }
  .ledger-col.minus textarea:focus{ border-color:var(--minus); }

  /* --- recommend toggle --- */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px;
  }
  .toggle-row .field-label{ margin:0; }
  .toggle-group{ display:flex; gap:8px; }
  .toggle{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.04em;
    padding:8px 16px;
    border-radius:3px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper-dim);
    cursor:pointer;
    transition:all .15s ease;
  }
  .toggle:hover{ border-color:var(--gold-dim); color:var(--paper); }
  .toggle.selected{
    background:var(--gold);
    border-color:var(--gold);
    color:#1a1206;
    font-weight:600;
  }

  /* --- submit --- */
  .submit-row{
    margin-top:34px;
    padding-top:22px;
    border-top:1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .total-line{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:0.04em;
  }
  .total-line span{ color:var(--gold); }

  button.submit{
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    color:#1a1206;
    background:var(--gold);
    border:none;
    padding:14px 26px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 10px 24px -8px rgba(232,163,61,0.5);
  }
  button.submit:hover{ background:#f0ae4d; transform:translateY(-1px); }
  button.submit:active{ transform:translateY(0px); }

  .confirm{
    display:none;
    margin-top:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--plus);
    text-align:center;
  }
  .confirm.show{ display:block; }

  .error{
    display:none;
    margin-top:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--minus);
    text-align:center;
  }
  .error.show{ display:block; }

  button.submit:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none;
  }

  @media (max-width: 520px){
    .receipt{ padding:34px 22px 30px; }
    .grid-2, .ledger{ grid-template-columns:1fr; }
    .ledger-divider{ display:none; }
    .star{ width:32px; height:32px; }
    .toggle-row{ flex-direction:column; align-items:flex-start; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Mijoz fikri</div>
  <h1>Tajribangiz bizga <em>muhim</em></h1>
  <p class="lede">Xizmatimiz haqidagi fikringiz boshqa mijozlarga to‘g‘ri tanlov qilishda yordam beradi. Ikki daqiqa vaqt ajrating — halol va aniq baho bering.</p>

  <form class="receipt" id="reviewForm">
    <div class="stub-row">
      <span>SHARH №2026-0417</span>
      <span id="dateStamp">--.--.----</span>
    </div>

    <div class="rating-block">
      <div class="rating-label">Umumiy baho</div>
      <div class="stars" id="starRow" role="radiogroup" aria-label="Umumiy baho, 5 balllik tizim">
        <span class="star" data-value="1" tabindex="0" role="radio" aria-checked="false" aria-label="1 yulduz">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        </span>
        <span class="star" data-value="2" tabindex="0" role="radio" aria-checked="false" aria-label="2 yulduz">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        </span>
        <span class="star" data-value="3" tabindex="0" role="radio" aria-checked="false" aria-label="3 yulduz">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        </span>
        <span class="star" data-value="4" tabindex="0" role="radio" aria-checked="false" aria-label="4 yulduz">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        </span>
        <span class="star" data-value="5" tabindex="0" role="radio" aria-checked="false" aria-label="5 yulduz">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        </span>
      </div>
      <div class="rating-caption" id="ratingCaption"></div>
    </div>

    <div class="section grid-2">
      <div>
        <label class="field-label" for="name">Ismingiz</label>
        <input type="text" id="name" name="name" placeholder="Aziza Karimova" required>
      </div>
      <div>
        <label class="field-label" for="role">Lavozim / kompaniya
          <span class="field-sub">(ixtiyoriy)</span>
        </label>
        <input type="text" id="role" name="role" placeholder="Marketing menejeri, ABC LLC">
      </div>
    </div>

    <div class="section ledger">
      <div class="ledger-col plus">
        <label class="field-label" for="pros"><span class="tag plus">+</span> Kuchli tomonlar</label>
        <textarea id="pros" name="pros" placeholder="Nima yoqdi? Masalan: tez xizmat, sifatli mahsulot..."></textarea>
      </div>
      <div class="ledger-divider"></div>
      <div class="ledger-col minus">
        <label class="field-label" for="cons"><span class="tag minus">−</span> Kamchiliklar</label>
        <textarea id="cons" name="cons" placeholder="Nimani yaxshilash kerak?"></textarea>
      </div>
    </div>

    <div class="section">
      <label class="field-label" for="comment">Qo‘shimcha fikringiz
        <span class="field-sub">Umumiy taassurotingizni batafsil yozing</span>
      </label>
      <textarea id="comment" name="comment" style="min-height:90px" placeholder="Xizmatdan umumiy taassurotingiz..."></textarea>
    </div>

    <div class="section">
      <div class="toggle-row">
        <label class="field-label">Do‘stlaringizga tavsiya qilasizmi?</label>
        <div class="toggle-group" id="recommendGroup">
          <button type="button" class="toggle" data-value="ha">Ha</button>
          <button type="button" class="toggle" data-value="balki">Balki</button>
          <button type="button" class="toggle" data-value="yoq">Yo‘q</button>
        </div>
      </div>
    </div>

    <div class="submit-row">
      <div class="total-line">BAHO: <span id="ratingEcho">— / 5</span></div>
      <button type="submit" class="submit">Sharhni yuborish</button>
    </div>

    <div class="confirm" id="confirmMsg">✓ Rahmat! Sharhingiz qabul qilindi.</div>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
  // Bot serveringiz manzili — botni serverga joylashtirgach shu yerni almashtiring,
  // masalan: "https://sizning-domen.com/review"
  const API_URL = "http://localhost:8080/review";

  // date stamp
  const d = new Date();
  document.getElementById('dateStamp').textContent =
    String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();

  // stars
  const stars = document.querySelectorAll('.star');
  const caption = document.getElementById('ratingCaption');
  const echo = document.getElementById('ratingEcho');
  const captions = {1:'Juda yomon', 2:'Yomon', 3:'O‘rtacha', 4:'Yaxshi', 5:'Ajoyib'};
  let rating = 0;

  function paint(value){
    stars.forEach(s => {
      const v = +s.dataset.value;
      s.classList.toggle('active', v <= value);
      s.setAttribute('aria-checked', v === rating ? 'true' : 'false');
    });
  }

  stars.forEach(s => {
    s.addEventListener('mouseenter', () => paint(+s.dataset.value));
    s.addEventListener('mouseleave', () => paint(rating));
    s.addEventListener('click', () => {
      rating = +s.dataset.value;
      paint(rating);
      caption.textContent = captions[rating];
      echo.textContent = rating + ' / 5';
    });
    s.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        rating = +s.dataset.value;
        paint(rating);
        caption.textContent = captions[rating];
        echo.textContent = rating + ' / 5';
      }
    });
  });

  // recommend toggle
  const toggles = document.querySelectorAll('#recommendGroup .toggle');
  let recommend = null;
  toggles.forEach(btn => {
    btn.addEventListener('click', () => {
      toggles.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      recommend = btn.dataset.value;
    });
  });

  // submit — botga yuboradi
  const form = document.getElementById('reviewForm');
  const submitBtn = form.querySelector('button.submit');
  const confirmMsg = document.getElementById('confirmMsg');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    if(rating === 0){
      caption.textContent = 'Iltimos, baho tanlang';
      caption.style.color = 'var(--minus)';
      return;
    }

    const name = document.getElementById('name').value.trim();
    if(!name){
      document.getElementById('name').focus();
      errorMsg.textContent = '⚠ Ismingizni kiriting';
      errorMsg.classList.add('show');
      return;
    }

    const payload = {
      name,
      role: document.getElementById('role').value.trim(),
      rating,
      pros: document.getElementById('pros').value.trim(),
      cons: document.getElementById('cons').value.trim(),
      comment: document.getElementById('comment').value.trim(),
      recommend: recommend || '',
    };

    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Yuborilmoqda...';

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if(!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Server xatosi');
      }

      confirmMsg.classList.add('show');
      setTimeout(() => confirmMsg.classList.remove('show'), 5000);

      // formani tozalash
      form.reset();
      rating = 0;
      recommend = null;
      paint(0);
      caption.textContent = '';
      echo.textContent = '— / 5';
      toggles.forEach(b => b.classList.remove('selected'));

    } catch(err){
      errorMsg.textContent = '⚠ Yuborilmadi: bot serveriga ulanib bo\'lmadi. Birozdan so\'ng qaytadan urinib ko\'ring.';
      errorMsg.classList.add('show');
      console.error(err);
    } finally{
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
    }
  });
</script>

</body>
</html>
