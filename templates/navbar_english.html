<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
  <defs>
    <!-- Asosiy yorqin gradiyent -->
    <linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'>
      <stop offset='0%25' stop-color='%2300f2ff'/>
      <stop offset='50%25' stop-color='%237000ff'/>
      <stop offset='100%25' stop-color='%23ff00c8'/>
    </linearGradient>
    
    <!-- Yumshoq soya effekti -->
    <filter id='f' x='-20%25' y='-20%25' width='140%25' height='140%25'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='3'/>
      <feOffset dx='0' dy='4' result='offsetblur'/>
      <feComponentTransfer>
        <feFuncA type='linear' slope='0.5'/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fon (Kvadrat) -->
  <rect width='128' height='128' rx='32' fill='%230f0f12'/>
  
  <!-- Gradiyentli doira va porlash -->
  <circle cx='64' cy='64' r='42' fill='url(%23g)' opacity='0.15'/>
  <circle cx='64' cy='64' r='36' fill='url(%23g)' filter='url(%23f)'/>

  <!-- Markaziy harf -->
  <text x='50%25' y='52%25' 
        font-size='42' 
        fill='white' 
        font-family='Segoe UI, Roboto, Helvetica, sans-serif'
        text-anchor='middle' 
        dominant-baseline='middle' 
        font-weight='900'
        style='text-shadow: 0 2px 10px rgba(0,0,0,0.3);'>
    M
  </text>
</svg>">
<nav class="navbar-custom">

  <a href="{% url 'home' %}" class="logo">
    🚀 Mock
  </a>

  <div class="nav-right">

    {% if user.is_authenticated %}

      <span class="user-info">
        👤 {{ user.username }}

        {% if user.role %}
          | <span class="role">{{ user.role }}</span>
        {% endif %}
      </span>

      <a href="{% url 'profile' %}" class="btn btn-blue">
        Profile
      </a>

      <form action="{% url 'logout' %}" method="POST" class="logout-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-red">
          🚪 Logout
        </button>
      </form>

    {% else %}

      <a href="{% url 'login' %}" class="btn btn-cyan">
        Login
      </a>

      <a href="{% url 'register' %}" class="btn btn-yellow">
        Register
      </a>

    {% endif %}

    <a href="{% url 'home_english' %}?lang=en" class="lang-btn">
      EN
    </a>

  </div>

</nav>
