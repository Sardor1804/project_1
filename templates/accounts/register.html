{% extends "base.html" %}
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
  <defs>
    <!-- Asosiy yorqin gradiyent -->
    <linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'>
      <stop offset='0%25' stop-color='%2300f2ff'/>
      <stop offset='50%25' stop-color='%237000ff'/>
      <stop offset='100%25' stop-color='%23ff00c8'/>
    </linearGradient>
    
    <!-- Yumshoq soya effekti -->
    <filter id='f' x='-20%25' y='-20%25' width='140%25' height='140%25'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='3'/>
      <feOffset dx='0' dy='4' result='offsetblur'/>
      <feComponentTransfer>
        <feFuncA type='linear' slope='0.5'/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fon (Kvadrat) -->
  <rect width='128' height='128' rx='32' fill='%230f0f12'/>
  
  <!-- Gradiyentli doira va porlash -->
  <circle cx='64' cy='64' r='42' fill='url(%23g)' opacity='0.15'/>
  <circle cx='64' cy='64' r='36' fill='url(%23g)' filter='url(%23f)'/>

  <!-- Markaziy harf -->
  <text x='50%25' y='52%25' 
        font-size='42' 
        fill='white' 
        font-family='Segoe UI, Roboto, Helvetica, sans-serif'
        text-anchor='middle' 
        dominant-baseline='middle' 
        font-weight='900'
        style='text-shadow: 0 2px 10px rgba(0,0,0,0.3);'>
    M
  </text>
</svg>">
{% block content %}
<style>
    /* Asosiy fon */
    .register-body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        font-family: 'Poppins', sans-serif;
    }

    /* Glassmorphism kartasi */
    .register-card {
        width: 90%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 25px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        text-align: center;
        color: white;
    }

    .register-card h3 {
        font-weight: 600;
        margin-bottom: 25px;
        letter-spacing: 1px;
    }

    /* Role tanlash tugmalari */
    .role-container {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
    }

    .role-btn {
        flex: 1;
        padding: 12px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        background: transparent;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .role-btn:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    .role-btn.active {
        background: #fff;
        color: #302b63;
        border-color: #fff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    /* Form elementlari */
    form p {
        text-align: left;
        margin-bottom: 15px;
    }

    input[type="text"], input[type="email"], input[type="password"], select {
        width: 100%;
        padding: 12px 15px;
        margin-top: 5px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        outline: none;
    }

    input:focus {
        border-color: #00d2ff;
        background: rgba(255, 255, 255, 0.1);
    }

    .submit-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #00d2ff, #3a7bd5);
        color: white;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        margin-top: 10px;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
    }

    .login-link {
        margin-top: 20px;
        font-size: 14px;
    }

    .login-link a {
        color: #00d2ff;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<div class="register-body">
    <div class="register-card">
        <h3>📝 Ro'yxatdan o'tish</h3>

        {% if error %}
            <div style="background: rgba(255, 0, 0, 0.2); padding: 10px; border-radius: 10px; margin-bottom: 15px;">
                {{ error }}
            </div>
        {% endif %}

        <div class="role-container">
            <button id="studentBtn" type="button" class="role-btn" onclick="setRole('student')">
                👨‍🎓 Talaba
            </button>
            <button id="teacherBtn" type="button" class="role-btn" onclick="setRole('teacher')">
                👨‍🏫 O'qituvchi
            </button>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="role" id="role_input" value="">
            
            {{ form.as_p }}

            <button type="submit" class="submit-btn">Hisob yaratish</button>
        </form>

        <div class="login-link">
            Akkountingiz bormi? <a href="{% url 'login' %}">Kirish</a>
        </div>
    </div>
</div>

<script>
    function setRole(role) {
        // Hidden inputga qiymatni yozish
        document.getElementById("role_input").value = role;

        // Tugmalarni aktiv holatga keltirish
        const studentBtn = document.getElementById("studentBtn");
        const teacherBtn = document.getElementById("teacherBtn");

        if (role === "student") {
            studentBtn.classList.add("active");
            teacherBtn.classList.remove("active");
        } else {
            teacherBtn.classList.add("active");
            studentBtn.classList.remove("active");
        }
    }
</script>
{% endblock %}
