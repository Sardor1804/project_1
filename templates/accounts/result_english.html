<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result | Mock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
  <defs>
    <linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'>
      <stop offset='0%25' stop-color='%2300f2ff'/>
      <stop offset='50%25' stop-color='%237000ff'/>
      <stop offset='100%25' stop-color='%23ff00c8'/>
    </linearGradient>

    <filter id='f' x='-20%25' y='-20%25' width='140%25' height='140%25'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='3'/>
      <feOffset dx='0' dy='4' result='offsetblur'/>
      <feComponentTransfer>
        <feFuncA type='linear' slope='0.5'/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>

  <rect width='128' height='128' rx='32' fill='%230f0f12'/>

  <circle cx='64' cy='64' r='42' fill='url(%23g)' opacity='0.15'/>
  <circle cx='64' cy='64' r='36' fill='url(%23g)' filter='url(%23f)'/>

  <text x='50%25' y='52%25'
        font-size='42'
        fill='white'
        font-family='Segoe UI, Roboto, Helvetica, sans-serif'
        text-anchor='middle'
        dominant-baseline='middle'
        font-weight='900'
        style='text-shadow: 0 2px 10px rgba(0,0,0,0.3);'>
    M
  </text>
</svg>">

    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-gold: #ffcc00;
            --bg-dark: #0a0a0c;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(112, 0, 255, 0.05) 0%, transparent 20%);
            min-height: 100vh;
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .stars-container {
            font-size: 40px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px var(--neon-gold));
        }

        .star-filled {
            color: var(--neon-gold);
        }

        .star-empty {
            color: rgba(255, 255, 255, 0.1);
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border: 4px solid rgba(0, 242, 255, 0.2);
            border-top: 4px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            background: rgba(0, 242, 255, 0.02);
            box-shadow: inset 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .score-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 5px;
        }

        .score-total {
            font-size: 0.9rem;
            opacity: 0.5;
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 5px;
            display: block;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .percent-badge {
            color: var(--neon-blue);
        }

        .btn-action {
            background: linear-gradient(45deg, #00f2ff, #7000ff);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 20px;
            display: block;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            border: none;
            box-shadow: 0 10px 20px rgba(112, 0, 255, 0.2);
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 242, 255, 0.4);
            color: white;
            letter-spacing: 3px;
        }

        .card-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: var(--neon-blue);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 15px var(--neon-blue);
        }
    </style>
</head>

<body>

<div class="result-card">
    <div class="card-line"></div>

    <!-- Result Header -->
    <div class="text-center mb-5">
        <div class="d-inline-flex align-items-center justify-content-center p-3 mb-4"
             style="background: rgba(0, 210, 255, 0.1); border-radius: 20px; border: 1px solid rgba(0, 210, 255, 0.2);">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 width="32"
                 height="32"
                 style="color: #00d2ff;">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </div>

        <h2 style="text-align: center;">
            Test Result
        </h2>

        <div style="height: 2px; width: 60px; background: linear-gradient(to right, #00d2ff, #7000ff); margin: 15px auto;"></div>
    </div>

    <div class="stars-container">
        {% if stars %}
            {{ stars|safe }}
        {% else %}
            <span class="star-empty">☆☆☆☆☆</span>
        {% endif %}
    </div>

    <div class="score-circle">
        <span class="score-num">{{ result.score|default:0 }}</span>
        <span class="score-total">/ 5 POINTS</span>
    </div>

    <div class="stats-grid">

        <div class="stat-item">
            <span class="stat-label">Percentage</span>
            <span class="stat-value percent-badge">{{ percentage|default:0 }}%</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Total Score</span>
            <span class="stat-value">{{ total_points|default:0 }}</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Subject</span>
            <span class="stat-value">{{ result.subject|default:"-" }}</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Level</span>
            <span class="stat-value text-capitalize">{{ result.level|default:"-" }}</span>
        </div>

    </div>

    <a href="{% url 'profile' %}" class="btn-action">
        <i class="fas fa-user-circle me-2"></i>
        Back to Profile
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
