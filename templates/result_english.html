<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
  <defs>
    <!-- Asosiy yorqin gradiyent -->
    <linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'>
      <stop offset='0%25' stop-color='%2300f2ff'/>
      <stop offset='50%25' stop-color='%237000ff'/>
      <stop offset='100%25' stop-color='%23ff00c8'/>
    </linearGradient>
    
    <!-- Yumshoq soya effekti -->
    <filter id='f' x='-20%25' y='-20%25' width='140%25' height='140%25'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='3'/>
      <feOffset dx='0' dy='4' result='offsetblur'/>
      <feComponentTransfer>
        <feFuncA type='linear' slope='0.5'/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fon (Kvadrat) -->
  <rect width='128' height='128' rx='32' fill='%230f0f12'/>
  
  <!-- Gradiyentli doira va porlash -->
  <circle cx='64' cy='64' r='42' fill='url(%23g)' opacity='0.15'/>
  <circle cx='64' cy='64' r='36' fill='url(%23g)' filter='url(%23f)'/>

  <!-- Markaziy harf -->
  <text x='50%25' y='52%25' 
        font-size='42' 
        fill='white' 
        font-family='Segoe UI, Roboto, Helvetica, sans-serif'
        text-anchor='middle' 
        dominant-baseline='middle' 
        font-weight='900'
        style='text-shadow: 0 2px 10px rgba(0,0,0,0.3);'>
    M
  </text>
</svg>">
    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .result-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-in-out;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .stars {
            font-size: 32px;
            color: gold;
            margin: 10px 0;
        }

        .big {
            font-size: 20px;
            margin: 8px 0;
            font-weight: 500;
        }

        .info {
            font-size: 16px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .btn-home {
            margin-top: 20px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            background: linear-gradient(45deg,#00c9ff,#92fe9d);
            border: none;
            color: #141e30;
            padding: 12px;
        }

        .btn-home:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="result-card">

    <h1>🎉 Test Result</h1>

    <!-- SCORE -->
    <div class="big">
        Score: {{ score|default:0 }} / 5
    </div>

    <!-- PERCENTAGE -->
    <div class="big">
        {{ percentage|default:0 }}%
    </div>

    <!-- TOTAL POINTS -->
    <div class="big">
        Total points: {{ total_points|default:0 }}
    </div>

    <!-- SUBJECT -->
    <div class="info">
        Subject: {{ subject|default:"-" }}
    </div>

    <!-- LEVEL -->
    <div class="info">
        Level: {{ level|default:"-" }}
    </div>

    <!-- STARS -->
    <div class="stars">
        {% if stars %}
            {{ stars }}
        {% else %}
            ☆☆☆☆☆
        {% endif %}
    </div>

    <a href="{% url 'subjects:home_english' %}" class="btn btn-home">
        🔙 Back to Home
    </a>

</div>

</body>
</html>
