

{% block content %}
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
  <defs>
    <!-- Asosiy yorqin gradiyent -->
    <linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'>
      <stop offset='0%25' stop-color='%2300f2ff'/>
      <stop offset='50%25' stop-color='%237000ff'/>
      <stop offset='100%25' stop-color='%23ff00c8'/>
    </linearGradient>
    
    <!-- Yumshoq soya effekti -->
    <filter id='f' x='-20%25' y='-20%25' width='140%25' height='140%25'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='3'/>
      <feOffset dx='0' dy='4' result='offsetblur'/>
      <feComponentTransfer>
        <feFuncA type='linear' slope='0.5'/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fon (Kvadrat) -->
  <rect width='128' height='128' rx='32' fill='%230f0f12'/>
  
  <!-- Gradiyentli doira va porlash -->
  <circle cx='64' cy='64' r='42' fill='url(%23g)' opacity='0.15'/>
  <circle cx='64' cy='64' r='36' fill='url(%23g)' filter='url(%23f)'/>

  <!-- Markaziy harf -->
  <text x='50%25' y='52%25' 
        font-size='42' 
        fill='white' 
        font-family='Segoe UI, Roboto, Helvetica, sans-serif'
        text-anchor='middle' 
        dominant-baseline='middle' 
        font-weight='900'
        style='text-shadow: 0 2px 10px rgba(0,0,0,0.3);'>
    M
  </text>
</svg>">
<style>
body {
  background: linear-gradient(135deg, #141e30, #243b55);
  min-height: 100vh;
  color: white;
}

/* Title */
h2 {
  font-weight: 700;
  letter-spacing: 1px;
}

/* Card design */
.card {
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  color: white;
  transition: 0.4s;
}

/* Hover animatsiya */
.card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}

/* Button style */
.btn {
  border-radius: 12px;
  font-weight: 600;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
  opacity: 0.9;
}

/* Icon katta qilish */
.card h4 {
  font-size: 22px;
  margin-bottom: 10px;
}

/* Fade animation */
.fade-in {
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.6s ease;
}

.fade-in.show {
  opacity: 1;
  transform: translateY(0);
}
</style>

<div class="container py-5">
  <h2 class="text-center mb-4">⚡ math – Darajani tanlang</h2>

  <div class="row justify-content-center g-4">

    <div class="col-md-4">
      <div class="card shadow text-center p-4">
        <h4>🟢 Easy</h4>
        <p>Boshlang‘ich daraja</p>
<a href="{% url 'subjects:math_easy' %}" class="btn btn-success w-100">
  Boshlash
</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow text-center p-4">
        <h4>🟡 Normal</h4>
        <p>O‘rtacha daraja</p>
<a href="{% url 'subjects:math_normal' %}" class="btn btn-warning w-100">
  Boshlash
</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow text-center p-4">
        <h4>🔴 Hard</h4>
        <p>Qiyin daraja</p>
<a href="{% url 'subjects:math_hard' %}" class="btn btn-danger w-100">
  Boshlash
</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
