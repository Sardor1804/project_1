<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ test.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
  <defs>
    <linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'>
      <stop offset='0%25' stop-color='%2300f2ff'/>
      <stop offset='50%25' stop-color='%237000ff'/>
      <stop offset='100%25' stop-color='%23ff00c8'/>
    </linearGradient>
    <filter id='f' x='-20%25' y='-20%25' width='140%25' height='140%25'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='3'/>
      <feOffset dx='0' dy='4' result='offsetblur'/>
      <feComponentTransfer>
        <feFuncA type='linear' slope='0.5'/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>
  <rect width='128' height='128' rx='32' fill='%230f0f12'/>
  <circle cx='64' cy='64' r='42' fill='url(%23g)' opacity='0.15'/>
  <circle cx='64' cy='64' r='36' fill='url(%23g)' filter='url(%23f)'/>
  <text x='50%25' y='52%25'
        font-size='42'
        fill='white'
        font-family='Segoe UI, Roboto, Helvetica, sans-serif'
        text-anchor='middle'
        dominant-baseline='middle'
        font-weight='900'
        style='text-shadow: 0 2px 10px rgba(0,0,0,0.3);'>
    M
  </text>
</svg>">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --card: #ffffff;
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.1);
            --danger-border: rgba(239, 68, 68, 0.32);
            --danger-glow: rgba(239, 68, 68, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 40px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* TEPADAGI BANNER (xabar) */
        #banner {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--primary), #06b6d4);
            color: #fff;
            text-align: center;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.87rem;
            letter-spacing: 0.5px;
            z-index: 99999;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        /* OGOHLANTIRISH OVERLAY */
        #warnOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 88888;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #warnOverlay.show { display: flex; }

        .warn-box {
            background: #ffffff;
            border: 1.5px solid var(--danger-border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 0 60px var(--danger-glow), 0 20px 48px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn { from { transform: scale(0.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .warn-icon  { font-size: 2.8rem; margin-bottom: 14px; }
        .warn-title { font-size: 1.15rem; font-weight: 700; color: var(--danger); margin-bottom: 10px; }
        .warn-text  { color: var(--text-sub); font-size: 0.93rem; line-height: 1.8; margin-bottom: 26px; }

        .warn-btn {
            background: linear-gradient(135deg, var(--danger), #f97316);
            border: none;
            color: #fff;
            padding: 12px 32px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.93rem;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s, transform 0.15s;
        }
        .warn-btn:hover { opacity: 0.88; transform: scale(1.03); }

        /* OXIRGI OGOHLANTIRISH STRIP */
        .warn-strip {
            display: none;
            background: var(--danger-soft);
            border: 1px solid var(--danger-border);
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 22px;
            font-size: 0.9rem;
            color: var(--danger);
            text-align: center;
            font-weight: 600;
        }
        .warn-strip.show { display: block; }

        /* Tepada qatib turuvchi panel */
        .quiz-header {
            position: sticky;
            top: 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .progress-container {
            flex: 1;
            margin-right: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.4s ease;
        }

        #timer {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            background: #eef2ff;
            padding: 8px 16px;
            border-radius: 12px;
            min-width: 80px;
            text-align: center;
            transition: all 0.3s;
        }
        #timer.danger {
            color: var(--danger) !important;
            background: var(--danger-soft);
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

        /* Savollar dizayni */
        .question-card {
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
        }

        .question-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-item {
            position: relative;
            cursor: pointer;
        }

        .option-item input {
            position: absolute;
            opacity: 0;
        }

        .option-label {
            display: block;
            padding: 16px 20px;
            background: #f8fafc;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-item input:checked + .option-label {
            border-color: var(--primary);
            background: #f0f1ff;
            color: var(--primary);
        }

        .option-item:hover .option-label {
            border-color: #e2e8f0;
            background: #f1f5f9;
        }

        /* Yakunlash tugmasi */
        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 600px) {
            .quiz-header { flex-direction: column; gap: 15px; }
            .progress-container { margin-right: 0; width: 100%; }
        }
    </style>
</head>
<body>

<!-- TEPADAGI BANNER -->
<div id="banner"></div>

<!-- OGOHLANTIRISH OVERLAY (1-marta yangilaganda chiqadi) -->
<div id="warnOverlay">
    <div class="warn-box">
        <div class="warn-icon">⚠️</div>
        <div class="warn-title">Sahifa yangilandi!</div>
        <div class="warn-text" id="warnText"></div>
        <button class="warn-btn" id="warnOkBtn">✓ &nbsp;Tushundim, davom etaman</button>
    </div>
</div>

<div class="container">
    <div class="quiz-header">
        <div class="progress-container">
            <span style="font-size: 14px; font-weight: 600; color: var(--text-sub);">Progress: <span id="progress-text">0</span>%</span>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
        <div id="timer">03:00</div>
    </div>

    <h1 style="margin-bottom: 30px; text-align: center; font-size: 24px;">{{ test.title }}</h1>

    <!-- OXIRGI OGOHLANTIRISH STRIP (overlay yopilgandan keyin chiqadi) -->
    <div class="warn-strip" id="warnStrip">
        ⚠️ <strong>Oxirgi ogohlantirish!</strong> Yana yangilasangiz, test <strong>avtomatik yakunlanadi!</strong>
    </div>

    <form method="post" id="quizForm">
        {% csrf_token %}
        {% for question in questions %}
            <div class="question-card">
                <div class="question-text">{{ forloop.counter }}. {{ question.text }}</div>
                <div class="options-grid">
                    {% for option in question.options.all %}
                        <label class="option-item">
                            <input type="radio" name="question_{{ question.id }}" value="{{ option.id }}" class="quiz-radio">
                            <span class="option-label">{{ option.text }}</span>
                        </label>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
        <input type="hidden" name="finish_reason" id="finishReasonInput" value="manual">
        <input type="hidden" name="time_spent" id="timeSpentInput" value="0">
        <button type="submit" class="submit-btn" id="submitBtn">Testni yakunlash</button>
    </form>
</div>

<script>
// ================================================================
//  Vaqtni saqlab qolish + sahifa yangilashni nazorat qilish
//  TOTAL = 180 sekund (3 daqiqa)
// ================================================================

var TOTAL     = 180;
var LS_START  = 'quiz_start_ts';
var LS_ANS    = 'quiz_ans';
var LS_WARNED = 'quiz_warned';
var LS_ULD    = 'quiz_unloading';
var SS_ALIVE  = 'quiz_alive';

var testFinished = false;
var timerInt     = null;
var startTs      = null;

var form          = document.getElementById('quizForm');
var radios        = document.querySelectorAll('.quiz-radio');
var totalQuestions = document.querySelectorAll('.question-card').length;
var progressFill  = document.getElementById('progress-fill');
var progressText  = document.getElementById('progress-text');
var timerEl       = document.getElementById('timer');

window.addEventListener('DOMContentLoaded', function () {

    var alive = null, savedTs = null, wasUnload = null;
    try {
        alive     = sessionStorage.getItem(SS_ALIVE);
        savedTs   = localStorage.getItem(LS_START);
        wasUnload = localStorage.getItem(LS_ULD);
        localStorage.removeItem(LS_ULD);
    } catch (e) {}

    var isRefresh = (alive === '1') && (savedTs !== null) && (wasUnload === '1');

    if (isRefresh) {
        // Sahifa qayta yangilangan — vaqtni qaytadan boshlamaymiz, davom ettiramiz
        startTs = parseInt(savedTs, 10);
        restoreAnswers();
        updateProgress();
        updateTimerDisplay();

        var warned = null;
        try { warned = localStorage.getItem(LS_WARNED); } catch (e) {}

        if (warned === '1') {
            // 2-marta yangilandi — test avtomatik yakunlanadi
            finishTest('refresh');
        } else {
            // 1-marta yangilandi — ogohlantirish ko'rsatamiz
            try { localStorage.setItem(LS_WARNED, '1'); } catch (e) {}
            showWarnOverlay();
            startTimer();
            listenAnswers();
        }

    } else {
        // Test birinchi marta ochilmoqda
        try {
            localStorage.removeItem(LS_ANS);
            localStorage.removeItem(LS_WARNED);
        } catch (e) {}

        startTs = Date.now();
        try {
            localStorage.setItem(LS_START, startTs);
            sessionStorage.setItem(SS_ALIVE, '1');
        } catch (e) {}

        updateTimerDisplay();
        startTimer();
        listenAnswers();
    }
});

function getRemaining() {
    if (!startTs) return 0;
    return Math.max(0, TOTAL - Math.floor((Date.now() - startTs) / 1000));
}

function startTimer() {
    updateTimerDisplay();
    if (timerInt) clearInterval(timerInt);
    timerInt = setInterval(function () {
        if (testFinished) return;
        updateTimerDisplay();
        if (getRemaining() <= 0) finishTest('timeout');
    }, 500);
}

function updateTimerDisplay() {
    var rem = getRemaining();
    var min = Math.floor(rem / 60);
    var sec = rem % 60;
    timerEl.textContent = (min < 10 ? '0' + min : min) + ':' + (sec < 10 ? '0' + sec : sec);
    timerEl.classList.toggle('danger', rem <= 30);
}

function updateProgress() {
    var answeredQuestions = new Set();
    radios.forEach(function (r) {
        if (r.checked) answeredQuestions.add(r.name);
    });
    var progress = totalQuestions ? Math.round((answeredQuestions.size / totalQuestions) * 100) : 0;
    progressFill.style.width = progress + '%';
    progressText.textContent = progress;
}

function saveAnswers() {
    var ans = {};
    radios.forEach(function (r) {
        if (r.checked) ans[r.name] = r.value;
    });
    try { localStorage.setItem(LS_ANS, JSON.stringify(ans)); } catch (e) {}
}

function restoreAnswers() {
    try {
        var raw = localStorage.getItem(LS_ANS);
        if (!raw) return;
        var data = JSON.parse(raw);
        Object.keys(data).forEach(function (k) {
            var el = document.querySelector('input[name="' + k + '"][value="' + data[k] + '"]');
            if (el) el.checked = true;
        });
    } catch (e) {}
}

function listenAnswers() {
    radios.forEach(function (r) {
        r.addEventListener('change', function () {
            updateProgress();
            saveAnswers();
        });
    });
}

function showWarnOverlay() {
    var rem = getRemaining();
    var min = Math.floor(rem / 60);
    var sec = rem % 60;
    var t   = (min < 10 ? '0' + min : min) + ':' + (sec < 10 ? '0' + sec : sec);

    document.getElementById('warnText').innerHTML =
        'Siz sahifani yangiladingiz.<br>' +
        'Qolgan vaqt: <strong style="color:var(--primary)">' + t + '</strong> — davom etmoqda.<br><br>' +
        '<strong style="color:var(--danger)">⚠️ Bu so\'nggi ogohlantirish!</strong><br>' +
        '<span style="color:var(--text-sub)">Yana yangilasangiz test <strong>avtomatik tugaydi</strong>.</span>';

    document.getElementById('warnOverlay').classList.add('show');
}

document.getElementById('warnOkBtn').addEventListener('click', function () {
    document.getElementById('warnOverlay').classList.remove('show');
    document.getElementById('warnStrip').classList.add('show');
});

function finishTest(reason) {
    if (testFinished) return;
    testFinished = true;
    clearInterval(timerInt);

    var timeSpent = Math.min(TOTAL, Math.floor((Date.now() - startTs) / 1000));

    try {
        localStorage.removeItem(LS_START);
        localStorage.removeItem(LS_ANS);
        localStorage.removeItem(LS_WARNED);
        localStorage.removeItem(LS_ULD);
        sessionStorage.removeItem(SS_ALIVE);
    } catch (e) {}

    document.getElementById('timeSpentInput').value    = timeSpent;
    document.getElementById('finishReasonInput').value = reason;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerText = "Yuborilmoqda...";
    form.submit();
}

window.addEventListener('beforeunload', function () {
    if (testFinished) return;
    try { localStorage.setItem(LS_ULD, '1'); } catch (e) {}
    saveAnswers();
});

form.addEventListener('submit', function (e) {
    if (testFinished) return; // finishTest orqali avtomatik yuborilgan bo'lsa, qayta to'xtatmaymiz
    e.preventDefault();
    finishTest('manual');
});
</script>

</body>
</html>
